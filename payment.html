<!DOCTYPE html><html lang="en"><head><title>Upgrade plan · BusinessOS</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>:root{--bg:#f5f7fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--blue:#2f5bff;--g:#16a34a;--r:#dc2626;--a:#d97706}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--ink:#e6edf7;--mut:#94a3b8;--line:#23314d}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:980px;margin:0 auto;padding:22px 14px 60px}h1{font-size:24px;margin:6px 0 4px}h2{font-size:17px;margin:0 0 10px}.sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.g{background:var(--g);color:#fff;border-color:var(--g)}.btn.d{color:var(--r)}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 12px}label{font-size:13px;font-weight:600;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}.kv b{word-break:break-all;text-align:right}.kv:last-child{border:0}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.verified{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}
.note{background:#eff6ff;color:#1e40af;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}.hidden{display:none}.qr{width:100%;max-width:280px;display:block;margin:0 auto;border-radius:12px;background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}.toast.bad{background:#dc2626}a{color:var(--blue)}</style></head><body><main>
<a href="subscription.html">← Plans &amp; billing</a>
<div id="auth" class="card hidden"><h2>Sign in to upgrade</h2><button class="btn p" id="gbtn">Continue with Google</button></div>
<div id="app" class="hidden"><h1 id="ttl">Upgrade your plan</h1><div class="sub" id="sub"></div><div id="err" class="err hidden"></div><div id="view"></div></div>
</main><div id="toast" class="toast hidden"></div>
<script src="plans-config.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,query,where,addDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA4GEKs3fxmiqq7iGI4-L-QuqFFwFBZ0dI",authDomain:"business-os-saas-traking.firebaseapp.com",projectId:"business-os-saas-traking",storageBucket:"business-os-saas-traking.firebasestorage.app",messagingSenderId:"316542715521",appId:"1:316542715521:web:32e84948bcc8d52ef9af80"}),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),P=window.BOS_PLANS,PAY=P.PAY;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const toast=(m,bad)=>{const t=$("toast");t.textContent=m;t.className="toast"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hidden"),3200)};
let user,bizId,plan,reqs=[],cur=null;
const when=v=>{const ms=v?.toMillis?v.toMillis():0;return ms?new Date(ms).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"};
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){toast("Copy failed — select and copy manually",true)}};
const row=(k,v,cp)=>`<div class="kv"><span>${k}</span><b>${esc(v)} ${cp?`<button class="btn" data-copy="${esc(v)}" style="padding:3px 9px;font-size:12px">Copy</button>`:""}</b></div>`;
function show(h){$("view").innerHTML=h}
async function load(){const s=await getDocs(query(collection(db,"paymentRequests"),where("customerUid","==",user.uid)));reqs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  cur=reqs.find(r=>r.planId===plan.key&&r.paymentStatus==="pending")||reqs.find(r=>r.planId===plan.key&&r.paymentStatus==="rejected")||null}
function summary(){return`<div class="card"><h2>${esc(plan.name)} plan</h2>${row("Amount",plan.price+" "+plan.per)}${row("Duration",plan.days+" days from activation")}${row("Records",plan.lim.customers.toLocaleString()+" customers / leads")}${row("Team members",plan.lim.team)}</div>`}
function render(){
  if(cur&&cur.paymentStatus==="pending"&&cur.submittedAt)return show(summary()+`<div class="card"><h2>Payment submitted — Awaiting verification</h2><span class="badge pending">Pending</span><p class="sub" style="margin-top:10px">We will activate your plan after we verify the payment in our account. This is not automatic and may take a few hours. Your plan stays unchanged until then.</p>${row("Reference / UTR",cur.utr)}${row("Submitted",when(cur.submittedAt))}${row("Amount",cur.amount?("₹"+cur.amount):"")}</div>`);
  if(!cur)return show(summary()+`<div class="card"><div class="note">Payment is manual (UPI or bank transfer). Your plan is activated only after the BusinessOS team verifies the payment.</div><button class="btn p" id="start">Proceed to payment — ${esc(plan.price)}</button></div>`+hist());
  show(summary()+(cur.paymentStatus==="rejected"?`<div class="err"><b>Previous payment was rejected.</b> ${esc(cur.rejectionReason||"")}<br>You can submit corrected details below.</div>`:"")+
  `<div class="grid"><div class="card"><h2>1 · Pay ${esc(plan.price)}</h2><img class="qr" src="${PAY.qr}" alt="UPI QR"><div style="text-align:center;font-size:13px;color:var(--mut);margin:8px 0">${esc(PAY.upiName)}</div>${row("UPI ID",PAY.upi,1)}<h2 style="margin-top:14px">Or bank transfer</h2>${row("Bank",PAY.bank.name)}${row("Account no.",PAY.bank.account,1)}${row("IFSC",PAY.bank.ifsc,1)}<div class="note">Pay the exact amount: <b>₹${cur.amount}</b>. Scanning the QR alone does not activate your plan.</div></div>
  <div class="card"><h2>2 · Submit payment details</h2><label>Payment method</label><select id="pm"><option value="upi">UPI</option><option value="bank">Bank transfer</option></select><label>UPI transaction reference / UTR *</label><input id="utr" placeholder="e.g. 412345678901" autocomplete="off"><label>Payment date *</label><input id="pd" type="date"><label>WhatsApp number (10 digits) *</label><input id="ph" inputmode="numeric" maxlength="10" placeholder="9876543210"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input id="wc" type="checkbox" style="width:auto;margin:3px 0 0"> I agree to receive payment/subscription updates on WhatsApp (you can also be contacted by phone or email).</label><label style="margin-top:10px;display:block">Remarks (optional)</label><textarea id="rm" rows="2"></textarea><button class="btn p" id="submit" style="width:100%">Submit for verification</button></div></div>`+hist())}
function hist(){const old=reqs.filter(r=>r!==cur);return old.length?`<div class="card"><h2>Earlier requests</h2>${old.slice(0,5).map(r=>row(esc(r.planId)+" · "+when(r.createdAt),r.paymentStatus)).join("")}</div>`:""}
document.addEventListener("click",async e=>{const c=e.target.closest("[data-copy]");if(c)return copy(c.dataset.copy);
  if(e.target.id==="start"){e.target.disabled=true;try{const ref=await addDoc(collection(db,"paymentRequests"),{customerUid:user.uid,customerName:user.displayName||user.email||"",businessId:bizId,planId:plan.key,amount:plan.amount,currency:"INR",durationDays:plan.days,paymentMethod:"upi",paymentStatus:"pending",subscriptionStatus:"inactive",createdAt:serverTimestamp()});await load();render()}catch(x){console.error(x);toast("Could not create request. "+(x.code==="permission-denied"?"Only the workspace owner can upgrade.":x.message),true);e.target.disabled=false}}
  if(e.target.id==="submit"){const utr=$("utr").value.trim(),pd=$("pd").value,ph=$("ph").value.replace(/\D/g,""),btn=e.target;
    if(!/^[A-Za-z0-9]{8,30}$/.test(utr))return toast("Enter a valid UTR / reference (8–30 letters or digits)",true);
    if(!pd||new Date(pd)>new Date())return toast("Choose the payment date (not in the future)",true);
    if(!/^[6-9]\d{9}$/.test(ph))return toast("Enter a valid 10-digit mobile number",true);
    btn.disabled=true;try{await updateDoc(doc(db,"paymentRequests",cur.id),{paymentMethod:$("pm").value,utr,paymentDate:pd,remarks:$("rm").value.trim().slice(0,300),customerPhone:"91"+ph,whatsappConsent:$("wc").checked,submittedAt:serverTimestamp(),paymentStatus:"pending"});toast("Submitted");await load();render()}catch(x){console.error(x);toast("Could not submit: "+(x.code==="permission-denied"?"not allowed":x.message),true);btn.disabled=false}}});
$("gbtn").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast(e.message,true));
onAuthStateChanged(auth,async u=>{user=u;if(!u){$("app").classList.add("hidden");$("auth").classList.remove("hidden");return}
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");
  try{const key=new URLSearchParams(location.search).get("plan");plan=P.PLANS.find(p=>p.key===key&&p.amount>0&&p.active);if(!plan)throw new Error("Choose a plan from Plans & billing first.");
    const us=await getDoc(doc(db,"users",u.uid));bizId=us.exists()&&us.data().businessId||u.uid;
    $("sub").textContent="Signed in as "+(u.email||"");await load();render()}catch(e){console.error(e);$("err").textContent=e.message;$("err").classList.remove("hidden")}});
</script></body></html>
