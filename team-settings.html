<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team &amp; Settings — BusinessOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e6eaf2;--bg:#f5f7fb;--blue:#2f5bff;--blue2:#1e40e0;--green:#0f9d6a;--amber:#d98a00;--red:#e0483f}
*{box-sizing:border-box;margin:0}html,body{overflow-x:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.02em}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f7bff,#2446e0);color:#fff;display:grid;place-items:center;font-weight:800}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}.nav a:hover{background:#f1f4fa;color:var(--ink)}
.acts{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}.btn:hover{border-color:#c9d3e6;background:#f8faff}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px #2f5bff33}.btn.p:hover{background:var(--blue2)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.menu{position:relative}.avatar{width:36px;height:36px;border-radius:50%;background:#e7edff;color:var(--blue);font-weight:700;display:grid;place-items:center;border:1px solid #d5defa}
.dd{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px #0f172a1f;min-width:220px;padding:8px;z-index:40}.dd .em{padding:8px 10px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line);margin-bottom:6px;word-break:break-all}
.dd a,.dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600}.dd a:hover,.dd button:hover{background:#f3f6fc}
main{max-width:1100px;margin:0 auto;padding:28px 24px 60px}
.hero{margin-bottom:18px}.hero h1{font-size:28px;letter-spacing:-.03em;font-weight:800}.hero p{color:var(--mut);margin-top:2px}
.role{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#eaf0ff;color:var(--blue);text-transform:capitalize;margin-left:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px #0f172a08}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;font-size:13px}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.pad{padding:22px}.pad h2{font-size:16px;font-weight:700}.pad .sub{color:var(--mut);font-size:12.5px;margin:2px 0 18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--mut)}.fg .full{grid-column:1/-1}
input,select,textarea{font-weight:500}
input[type=text],input[type=email],input[type=url],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink);background:#fff;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2f5bff1f;outline:0}input.bad{border-color:var(--red)}.fe{color:var(--red);font-size:11.5px;font-weight:500;min-height:0}
.mf{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.mf .dirty{margin-right:auto;color:var(--amber);font-size:12.5px;font-weight:600}
.pv{display:flex;gap:12px;align-items:center;padding:14px;background:#f8faff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}.pv .logo{width:46px;height:46px;font-size:18px;border-radius:13px}.pv b{display:block;font-size:15px}.pv span{color:var(--mut);font-size:12.5px}
.link{display:flex;gap:8px}.link input{flex:1;min-width:0;font-size:12px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv span{color:var(--mut)}.kv b{text-align:right;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font-size:22px;font-weight:800}.stat span{color:var(--mut);font-size:12px}
.inv{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px;margin-bottom:6px}
.note{background:#fff8e6;border:1px solid #f6e1a8;color:#7a5200;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0 18px}
.tr{display:grid;grid-template-columns:minmax(0,2fr) 90px 90px 300px;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.request-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;background:#fff}.request-card p{color:var(--mut);font-size:12.5px;margin-top:6px}.activity-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px}.smallmut{font-size:12px;color:var(--mut)}.twobuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:760px){.tr{grid-template-columns:minmax(0,1fr) auto;gap:8px}.tr>.tag{display:none}.tr .ra{grid-column:1/-1}.inv{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
.who{display:flex;gap:12px;align-items:center;min-width:0}.av{width:38px;height:38px;border-radius:50%;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}.who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#eef2f8;color:#475569;text-transform:capitalize;text-align:center}.tag.active{background:#e3f7ee;color:#0a7a50}.tag.disabled{background:#fdecea;color:var(--red)}.tag.owner{background:#efe8ff;color:#5b34d6}
.ra{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap}.mini:hover{background:#f5f8ff}.mini.d{color:var(--red)}.mini.x{padding:7px 9px;color:#94a3b8}.mini.x:hover{color:var(--red);border-color:#f3c1bb}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.roles div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--mut)}.roles b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.track{height:10px;border-radius:99px;background:#eef2f8;overflow:hidden;margin:10px 0 6px}.track i{display:block;height:100%;background:var(--blue);border-radius:99px}.track i.w{background:var(--amber)}.track i.f{background:var(--red)}
.err{background:#fff4f2;border:1px solid #f3c1bb;color:#9b2c22;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,#eef2f8,#f8faff,#eef2f8);background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;z-index:90}.toast.bad{background:var(--red)}
.auth{min-height:70vh;display:grid;place-items:center}.auth .card{max-width:380px;text-align:center;padding:34px}.auth h2{font-size:22px;margin:10px 0 6px}.auth p{color:var(--mut);margin-bottom:18px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.top-in{padding:10px 14px 0;gap:10px;flex-wrap:wrap;height:auto}.nav{order:3;flex-basis:100%;padding-bottom:8px}.acts .btn{display:none}main{padding:18px 14px 50px}.hero h1{font-size:23px}.fg,.roles,.inv{grid-template-columns:1fr}.tr{grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.tr .tag{align-self:center}.tr .ra{grid-column:1/-1;justify-content:flex-start}.pad{padding:16px}}
/* ===== Requests, status pills & activity (shared design system) ===== */
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.sh h2{font-size:17px;font-weight:700;letter-spacing:-.01em}.sh .sub{margin-bottom:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools select{width:auto;min-width:200px;padding:8px 12px}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}.btn svg{flex:none}
.btn.d{color:var(--red)}.btn.d:hover{background:#fff4f2;border-color:#f3c1bb}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px 4px 9px;border-radius:99px;background:#eef2f8;color:#475569;white-space:nowrap;line-height:1.2}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st.pending{background:#fff4dc;color:#a36200}.st.approved,.st.active{background:#e3f7ee;color:#0a7a50}
.st.rejected,.st.disabled{background:#fdecea;color:#c4372f}.st.used{background:#e8efff;color:#2446e0}.st.revoked{background:#eceff4;color:#5b6679}
.rl{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;background:#f1f4fa;color:#475569;white-space:nowrap}
.rl.owner{background:#efe8ff;color:#5b34d6}.rl.admin{background:#e8efff;color:#2446e0}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.fl .f{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 8px 6px 13px;font-size:12.5px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:8px}
.fl .f b{min-width:22px;text-align:center;padding:1px 6px;border-radius:99px;background:#eef2f8;color:#475569;font-size:11.5px}
.fl .f:hover{border-color:#c9d3e6;color:var(--ink)}.fl .f.on{background:var(--ink);border-color:var(--ink);color:#fff}.fl .f.on b{background:#ffffff26;color:#fff}
.fl .f.hot:not(.on) b{background:var(--amber);color:#fff}
.rq{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px 18px;margin-top:10px}
.rq.pending{border-left:3px solid var(--amber)}
.rq-h{display:flex;gap:12px;align-items:flex-start}
.rq-t{flex:1;min-width:0}.rq-t b{display:block;font-size:14.5px;font-weight:700}.rq-t span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.rq-r{display:grid;justify-items:end;gap:6px;flex:none}.rq-r time{font-size:11.5px;color:var(--mut)}
.rq-reason{margin:12px 0 0 50px;padding:10px 13px;background:#f8faff;border:1px solid var(--line);border-radius:10px;font-size:13px;color:#334155;overflow-wrap:anywhere}
.rq-reason small{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:2px}
.rq-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0 50px}.rq-hint{font-size:12px;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.empty{border:1px dashed #cfd8ea;background:#fafcff;border-radius:14px;padding:26px 18px;text-align:center;color:var(--mut);font-size:13px;margin-top:12px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.tl{margin-top:8px}.tl-i{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;padding:11px 0;position:relative}
.tl-i:not(:last-child)::after{content:"";position:absolute;left:15px;top:44px;bottom:-1px;width:1px;background:var(--line)}
.tl-i b{font-size:13.5px;font-weight:600}
.tl-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef2f8;color:#475569}
.tl-ic.ok{background:#e3f7ee;color:#0a7a50}.tl-ic.bad{background:#fdecea;color:#c4372f}.tl-ic.warn{background:#fff4dc;color:#a36200}.tl-ic.info{background:#e8efff;color:#2446e0}
.tl-r{display:flex;align-items:flex-start;gap:8px}.tl-r time{font-size:12px;color:var(--mut);white-space:nowrap;padding-top:2px}

/* ===== Team & settings — professional layer ===== */
main{max-width:1060px}
.hero{margin-bottom:22px}.hero h1{font-size:30px}.hero p{font-size:14px}
.role{background:#e8efff;color:#2446e0;margin-left:2px}
.chips{gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:none;border-radius:0;padding:12px 16px;color:var(--mut);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip:hover{color:var(--ink)}.chip.on{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--blue)}
.chip .bd{background:var(--amber);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
.stats{gap:10px;margin-bottom:6px}.stat{background:#f8faff;border-radius:12px;padding:14px 16px}.stat b{font-size:24px;letter-spacing:-.02em}.stat span{font-weight:500}
.ip{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0 24px}
.ip h3{font-size:14px;font-weight:700}.ip p{color:var(--mut);font-size:12.5px;margin-top:2px}
.inv{grid-template-columns:minmax(0,1fr) 160px auto;align-items:end;margin:14px 0 0}
.inv label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--mut)}
.tbh{display:grid;grid-template-columns:minmax(0,2fr) 120px 110px minmax(0,300px);gap:12px;padding:10px 4px;font-size:12px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--line)}
.tr{grid-template-columns:minmax(0,2fr) 120px 110px minmax(0,300px);padding:14px 4px}.tr:first-of-type{border-top:0}
.tr .ra{justify-content:flex-end}
.roles div{background:#fafcff}
@media(max-width:760px){.tbh{display:none}.tr{grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.tr .ra{grid-column:1/-1;justify-content:flex-start}.inv{grid-template-columns:1fr}.tools select{min-width:0;width:100%}.rq-reason,.rq-a{margin-left:0}.rq-h{flex-wrap:wrap}.tl-i{grid-template-columns:32px minmax(0,1fr)}.tl-r{grid-column:2}}
.sh+.stats{margin-top:18px}.sh .sub{margin-bottom:0}
.tbh,.tr{grid-template-columns:minmax(0,1.6fr) 110px 100px minmax(0,380px)!important}
.tr .ra{flex-wrap:nowrap;gap:6px}
@media(max-width:900px){.tr .ra{flex-wrap:wrap}}
@media(max-width:760px){.tbh{display:none}.tr{grid-template-columns:minmax(0,1fr) auto auto!important;gap:8px}.tr .ra{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}}
.fl .f.clr{margin-left:auto;border-style:dashed;padding:6px 13px;color:var(--red)}.fl .f.clr:hover{background:#fff4f2;border-color:#f3c1bb;color:var(--red)}.rq-h>.mini.x{align-self:flex-start;flex:none}
</style>

function listenInvites(){if(unsubI)unsubI();if(!manager)return;unsubI=onSnapshot(collection(db,"businesses",bizId,"teamInvites"),s=>{invites=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="team")render()},e=>{console.error(e);$("err").textContent="Could not load team: "+(e.code||e.message);$("err").classList.remove("hidden")})}
onAuthStateChanged(auth,async u=>{user=u;
  if(!u){$("app").classList.add("hidden");$("auth").classList.remove("hidden");return}
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("avBtn").textContent=ini(u.displayName||u.email);$("ddEm").textContent=u.email||"";
  try{await resolve(u);$("err").classList.add("hidden");render();listenInvites();listenOwnerFeed();await loadUsage();if(tab==="plan")render()}catch(e){console.error(e);$("body").innerHTML="";$("chips").innerHTML="";$("sub").textContent="";$("err").textContent=e.message||"Could not open workspace.";$("err").classList.remove("hidden")}});
$("avBtn").onclick=e=>{e.stopPropagation();$("dd").classList.toggle("hidden")};document.addEventListener("click",()=>$("dd").classList.add("hidden"));
$("out").onclick=()=>signOut(auth);$("gbtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("aerr").textContent=e.message}};
document.addEventListener("submit",e=>{if(e.target.id==="invf")invite(e)});
document.addEventListener("click",async e=>{const t=e.target,c=t.closest("[data-tab]");if(c){tab=c.dataset.tab;render();return}const dr=t.closest("[data-delete-request]");if(dr){await deleteTeamRequest(dr.dataset.deleteRequest);return}if(t.closest("[data-clear-closed]")){await clearClosedRequests();return}const sf=t.closest("[data-sf]");if(sf){statusFilter=sf.dataset.sf;renderRequestActivityLists();return}
  const md=t.closest("[data-member-detail]");if(md){selectedMember=decodeURIComponent(md.dataset.memberDetail);statusFilter="all";tab="requests";render();return}
  const rr=t.closest("[data-review-request]");if(rr){await reviewTeamRequest(rr.dataset.reviewRequest,rr.dataset.status);return}const rv=t.closest("[data-revoke-request]");if(rv){await revokeTeamRequest(rv.dataset.revokeRequest);return}const da=t.closest("[data-delete-activity]");if(da){await deleteTeamActivity(da.dataset.deleteActivity);return}
  if(t.id==="cid"){try{await navigator.clipboard.writeText(bizId);toast("Workspace ID copied")}catch(x){toast("Copy failed",true)}return}
  const g=t.closest("[data-tg]");if(g){const em=decodeURIComponent(g.dataset.tg);try{await updateDoc(doc(db,"businesses",bizId,"teamInvites",em),{status:g.dataset.to,updatedAt:serverTimestamp()});await logTeamActivity(g.dataset.to==="active"?"member_activated":"member_disabled",`${g.dataset.to==="active"?"Activated":"Disabled"} team member ${em}`,em);toast(g.dataset.to==="active"?"Member activated":"Member disabled");if(tab==="requests")await loadRequestsActivity()}catch(x){toast(x.message||"Could not update",true)}return}
  const r=t.closest("[data-rm]");if(r){const em=decodeURIComponent(r.dataset.rm);if(!confirm(`Remove ${em} from your team? They will lose access.`))return;try{await deleteDoc(doc(db,"businesses",bizId,"teamInvites",em));await logTeamActivity("member_removed",`Removed team member ${em}`,em);toast("Member removed")}catch(x){toast(x.message||"Could not remove",true)}}});
</script>
