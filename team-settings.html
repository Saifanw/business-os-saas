<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team &amp; Settings — BusinessOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e6eaf2;--bg:#f5f7fb;--blue:#2f5bff;--blue2:#1e40e0;--green:#0f9d6a;--amber:#d98a00;--red:#e0483f}
*{box-sizing:border-box;margin:0}html,body{overflow-x:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.02em}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f7bff,#2446e0);color:#fff;display:grid;place-items:center;font-weight:800}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}.nav a:hover{background:#f1f4fa;color:var(--ink)}
.acts{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}.btn:hover{border-color:#c9d3e6;background:#f8faff}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px #2f5bff33}.btn.p:hover{background:var(--blue2)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.menu{position:relative}.avatar{width:36px;height:36px;border-radius:50%;background:#e7edff;color:var(--blue);font-weight:700;display:grid;place-items:center;border:1px solid #d5defa}
.dd{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px #0f172a1f;min-width:220px;padding:8px;z-index:40}.dd .em{padding:8px 10px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line);margin-bottom:6px;word-break:break-all}
.dd a,.dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600}.dd a:hover,.dd button:hover{background:#f3f6fc}
main{max-width:1100px;margin:0 auto;padding:28px 24px 60px}
.hero{margin-bottom:18px}.hero h1{font-size:28px;letter-spacing:-.03em;font-weight:800}.hero p{color:var(--mut);margin-top:2px}
.role{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#eaf0ff;color:var(--blue);text-transform:capitalize;margin-left:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px #0f172a08}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;font-size:13px}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.pad{padding:22px}.pad h2{font-size:16px;font-weight:700}.pad .sub{color:var(--mut);font-size:12.5px;margin:2px 0 18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--mut)}.fg .full{grid-column:1/-1}
input,select,textarea{font-weight:500}
input[type=text],input[type=email],input[type=url],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink);background:#fff;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2f5bff1f;outline:0}input.bad{border-color:var(--red)}.fe{color:var(--red);font-size:11.5px;font-weight:500;min-height:0}
.mf{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.mf .dirty{margin-right:auto;color:var(--amber);font-size:12.5px;font-weight:600}
.pv{display:flex;gap:12px;align-items:center;padding:14px;background:#f8faff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}.pv .logo{width:46px;height:46px;font-size:18px;border-radius:13px}.pv b{display:block;font-size:15px}.pv span{color:var(--mut);font-size:12.5px}
.link{display:flex;gap:8px}.link input{flex:1;min-width:0;font-size:12px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv span{color:var(--mut)}.kv b{text-align:right;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font-size:22px;font-weight:800}.stat span{color:var(--mut);font-size:12px}
.inv{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px;margin-bottom:6px}
.note{background:#fff8e6;border:1px solid #f6e1a8;color:#7a5200;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0 18px}
.tr{display:grid;grid-template-columns:minmax(0,2fr) 90px 90px 235px;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.who{display:flex;gap:12px;align-items:center;min-width:0}.av{width:38px;height:38px;border-radius:50%;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}.who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#eef2f8;color:#475569;text-transform:capitalize;text-align:center}.tag.active{background:#e3f7ee;color:#0a7a50}.tag.disabled{background:#fdecea;color:var(--red)}.tag.owner{background:#efe8ff;color:#5b34d6}
.ra{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap}.mini:hover{background:#f5f8ff}.mini.d{color:var(--red)}.mini.x{padding:7px 9px;color:#94a3b8}.mini.x:hover{color:var(--red);border-color:#f3c1bb}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.roles div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--mut)}.roles b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.track{height:10px;border-radius:99px;background:#eef2f8;overflow:hidden;margin:10px 0 6px}.track i{display:block;height:100%;background:var(--blue);border-radius:99px}.track i.w{background:var(--amber)}.track i.f{background:var(--red)}
.err{background:#fff4f2;border:1px solid #f3c1bb;color:#9b2c22;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,#eef2f8,#f8faff,#eef2f8);background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;z-index:90}.toast.bad{background:var(--red)}
.auth{min-height:70vh;display:grid;place-items:center}.auth .card{max-width:380px;text-align:center;padding:34px}.auth h2{font-size:22px;margin:10px 0 6px}.auth p{color:var(--mut);margin-bottom:18px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.top-in{padding:10px 14px 0;gap:10px;flex-wrap:wrap;height:auto}.nav{order:3;flex-basis:100%;padding-bottom:8px}.acts .btn{display:none}main{padding:18px 14px 50px}.hero h1{font-size:23px}.fg,.roles,.inv{grid-template-columns:1fr}.tr{grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.tr .tag{align-self:center}.tr .ra{grid-column:1/-1;justify-content:flex-start}.pad{padding:16px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="customers.html"><span class="logo">B</span>BusinessOS</a>
  <nav class="nav"><a href="customers.html">Overview</a><a href="customer-list.html">Customers</a><a href="followups.html">Follow-ups</a><a href="deals.html">Deals</a><a href="website-leads.html">Leads</a><a href="whatsapp-center.html">WhatsApp</a><a href="business-finder-app.html">Finder</a><a href="reports.html">Reports</a></nav>
  <div class="acts"><a class="btn p" href="customer-list.html?add=1">＋ Add Customer</a>
    <div class="menu"><button class="avatar" id="avBtn" aria-label="Account">?</button><div class="dd hidden" id="dd"><div class="em" id="ddEm"></div><a href="import-export.html#import-section">↑ Import customers</a><a href="import-export.html#export-section">↓ Export data</a><a href="team-settings.html" style="color:var(--blue)">⚙ Team &amp; settings</a><a href="subscription.html">Plan &amp; billing</a><button id="out">Logout</button></div></div></div>
</div></header>
<main>
  <div id="auth" class="auth hidden"><div class="card"><div class="logo" style="margin:auto;width:46px;height:46px;font-size:20px">B</div><h2>Welcome to BusinessOS</h2><p>Sign in to manage your business profile and team.</p><button class="btn p" id="gbtn" style="width:100%;justify-content:center">Continue with Google</button><p id="aerr" style="color:var(--red);font-size:12px;margin-top:12px"></p></div></div>
  <div id="app" class="hidden">
    <div id="err" class="err hidden"></div>
    <section class="hero"><h1>Team &amp; settings</h1><p id="sub">Loading…</p></section>
    <div class="chips" id="chips"></div>
    <div id="body"><div class="card pad"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div></div>
  </div>
</main>
<div id="toast" class="toast hidden"></div>

<script type="module">
import{resolveWorkspace,blockWorkspace}from"./assets/workspace.js";
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import{getFirestore,collection,collectionGroup,doc,getDoc,getDocs,onSnapshot,query,where,updateDoc,setDoc,deleteDoc,serverTimestamp,getCountFromServer}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA4GEKs3fxmiqq7iGI4-L-QuqFFwFBZ0dI",authDomain:"business-os-saas-traking.firebaseapp.com",projectId:"business-os-saas-traking",storageBucket:"business-os-saas-traking.firebasestorage.app",messagingSenderId:"316542715521",appId:"1:316542715521:web:32e84948bcc8d52ef9af80"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const clean=v=>String(v??"").replace(/["'`]+/g,"").trim(),ini=n=>clean(n||"?").split(/[\s@.]+/).filter(Boolean).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"?";
const FREE_LIMIT=10,PAID=["starter","growth","custom","business","paid"],F=[["name","Business name","text",1],["businessType","Business type","text"],["phone","Phone","tel"],["whatsapp","WhatsApp number","tel"],["city","City","text"],["area","Area","text"],["website","Website","url"],["description","Short description","ta",1]];
let user,bizId,biz={},role="sales",manager=false,tab="profile",invites=[],joinLinks=[],usage=null,unsubI,unsubJ,form={};
const toast=(m,bad)=>{const t=$("toast");t.textContent=m;t.className="toast"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hidden"),2600)};
const dt=v=>{const d=v?.toDate?v.toDate():v?.seconds?new Date(v.seconds*1000):null;return d?d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—"};
const formUrl=()=>{const u=new URL("lead-capture.html",location.href);u.searchParams.set("business",bizId);u.searchParams.set("template",biz.templateId||"general");u.searchParams.set("businessName",biz.name||"Business");return u.href};
async function resolve(u){const w=await resolveWorkspace(db,u);if(!w.biz)throw new Error("No BusinessOS workspace is linked to this Google account.");bizId=w.bizId;biz=w.biz;role=w.role;manager=w.manager}
async function loadUsage(){try{const[c,l]=await Promise.all([getCountFromServer(collection(db,"businesses",bizId,"contacts")),getCountFromServer(query(collection(db,"publicLeads"),where("businessId","==",bizId)))]);usage=c.data().count+l.data().count}catch(e){console.warn("usage",e);usage=null}}
function head(){const nm=clean(biz.name)||"Your business";$("sub").innerHTML=`${esc(nm)} · you are <span class="role">${esc(role)}</span>`;
  const T=manager?[["profile","Business profile"],["team","Team"],["plan","Plan & workspace"]]:[["profile","My access"]];if(!T.some(t=>t[0]===tab))tab=T[0][0];
  $("chips").innerHTML=T.map(t=>`<button class="chip${tab===t[0]?" on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}
function render(){head();$("body").innerHTML=!manager?member():tab==="profile"?profile():tab==="team"?team():plan();if(manager&&tab==="profile")bindForm()}
function member(){return`<div class="card pad"><h2>Your access</h2><div class="sub">You are a team member of this workspace.</div><div class="kv"><span>Business</span><b>${esc(clean(biz.name)||"—")}</b></div><div class="kv"><span>Your role</span><b style="text-transform:capitalize">${esc(role)}</b></div><div class="kv"><span>Signed in as</span><b>${esc(user.email||"")}</b></div><div class="note">You can work with customers, follow-ups and deals. Only the owner or an admin can change business settings and manage the team.</div></div>`}
function profile(){const url=formUrl();return`<div class="grid"><form class="card pad" id="bf" novalidate><h2>Business profile</h2><div class="sub">Used across your workspace and on your public enquiry form.</div>
  <div class="fg">${F.map(([k,l,t,full])=>`<label class="${full?"full":""}">${l}${t==="ta"?`<textarea id="f_${k}" rows="3" maxlength="300"></textarea>`:`<input id="f_${k}" type="${t==="tel"?"tel":t}" ${k==="businessType"?'list="types"':""}>`}<span class="fe" id="e_${k}"></span></label>`).join("")}</div>
  <datalist id="types"><option>Real Estate</option><option>Insurance</option><option>Education</option><option>Clinic</option><option>Retail</option><option>Agency</option><option>Services</option><option>Other</option></datalist>
  <div class="mf"><span class="dirty hidden" id="dirty">● Unsaved changes</span><button type="button" class="btn" id="discard" disabled>Discard</button><button type="submit" class="btn p" id="save" disabled>Save changes</button></div></form>
  <div style="display:grid;gap:16px"><div class="card pad"><h2>How you appear</h2><div class="sub">Preview of your business identity.</div><div class="pv"><div class="logo" id="pvL">${esc(ini(biz.name))}</div><div><b id="pvN">${esc(clean(biz.name)||"Your business")}</b><span id="pvS">${esc([biz.businessType,biz.city].map(clean).filter(Boolean).join(" · ")||"Add type and city")}</span></div></div>
  <h2 style="font-size:13px">Your enquiry form</h2><div class="sub" style="margin-bottom:10px">Share it to collect leads automatically.</div><div class="link"><input type="text" readonly value="${esc(url)}" aria-label="Enquiry form link"><button class="btn" id="cp" type="button">Copy</button></div></div></div></div>`}
function bindForm(){F.forEach(([k])=>{form[k]=clean(biz[k]);const el=$("f_"+k);el.value=biz[k]||"";el.addEventListener("input",chk)});
  $("cp").onclick=async()=>{try{await navigator.clipboard.writeText(formUrl());toast("Form link copied")}catch(e){toast("Press Ctrl+C to copy",true)}};
  $("discard").onclick=()=>{F.forEach(([k])=>$("f_"+k).value=biz[k]||"");chk()};$("bf").onsubmit=saveProfile}
function vals(){const o={};F.forEach(([k])=>o[k]=$("f_"+k).value.trim());return o}
function chk(){const v=vals(),d=F.some(([k])=>v[k]!==clean(biz[k])&&v[k]!==(biz[k]||""));$("save").disabled=!d;$("discard").disabled=!d;$("dirty").classList.toggle("hidden",!d);
  $("pvN").textContent=v.name||"Your business";$("pvL").textContent=ini(v.name);$("pvS").textContent=[v.businessType,v.city].filter(Boolean).join(" · ")||"Add type and city"}
async function saveProfile(e){e.preventDefault();const v=vals();let ok=true;
  const bad=(k,m)=>{$("e_"+k).textContent=m;$("f_"+k).classList.toggle("bad",!!m);if(m)ok=false};F.forEach(([k])=>bad(k,""));
  if(!v.name)bad("name","Business name is required");
  if(v.phone&&v.phone.replace(/\D/g,"").length<10)bad("phone","Enter a valid 10-digit number");if(v.whatsapp&&v.whatsapp.replace(/\D/g,"").length<10)bad("whatsapp","Enter a valid 10-digit number");
  if(v.website&&!/^https?:\/\/.+\..+/i.test(v.website))bad("website","Start with http:// or https://");if(!ok)return;
  try{$("save").disabled=true;await updateDoc(doc(db,"businesses",bizId),{...v,updatedAt:serverTimestamp()});Object.assign(biz,v);toast("Business settings saved");head();chk()}catch(x){console.error(x);toast(x.message||"Could not save settings",true);$("save").disabled=false}}
function team(){const rows=[{id:"owner",email:biz.ownerEmail||(role==="owner"?user.email:""),name:biz.ownerName||"Business owner",role:"owner",status:"active",createdAt:biz.createdAt}].concat(invites.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));
  const act=rows.filter(r=>r.status==="active").length;
  return`<div class="card pad"><h2>Team members</h2><div class="sub">Invite people who work with you. They sign in with the same Google account.</div>
  <div class="stats"><div class="stat"><b>${rows.length}</b><span>Total</span></div><div class="stat"><b>${act}</b><span>Active</span></div><div class="stat"><b>${rows.length-act}</b><span>Disabled</span></div></div>
  <div class="note">Create a reusable join link. Anyone with the active link can sign in with Google and join this workspace as a Sales Agent. Revoke the link whenever you need to stop new joins.</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><button class="btn p" id="makeJoinLink" type="button">＋ Create Sales Join Link</button><button class="btn" id="copyJoinLink" type="button" disabled>Copy latest link</button><a class="btn" id="shareJoinLink" target="_blank" rel="noopener" href="#" style="pointer-events:none;opacity:.45">Share on WhatsApp</a></div>
  <div id="joinLinkMsg" class="sub" style="margin-bottom:12px">No join link created in this session.</div>
  <div id="joinLinksList">${joinLinks.map(j=>`<div class="kv"><span>Sales join link · ${esc(dt(j.createdAt))} · ${esc(j.status)}</span><div style="display:flex;gap:6px"><button class="mini" data-copy-link="${esc(j.id)}" ${j.status==='revoked'?'disabled':''}>Copy</button><button class="mini ${j.status==='active'?'d':''}" data-revoke-link="${esc(j.id)}" ${j.status==='revoked'?'disabled':''}>${j.status==='active'?'Revoke':'Revoked'}</button></div></div>`).join('')}</div>
  <details style="margin:12px 0"><summary style="cursor:pointer;font-weight:600">Invite a specific email (legacy)</summary><form class="inv" id="invf" novalidate style="margin-top:12px"><input id="ie" type="email" placeholder="teammate@gmail.com" aria-label="Teammate email"><select id="ir" aria-label="Role"><option value="sales">Sales</option><option value="admin">Admin</option></select><button class="btn p" type="submit">Invite</button></form></details>
  ${rows.map(r=>`<div class="tr"><div class="who"><div class="av">${esc(ini(r.name||r.email))}</div><div style="min-width:0"><b>${esc(r.id==="owner"?r.name:r.email)}</b><span>${esc(r.id==="owner"?r.email:"Invited "+dt(r.createdAt))}</span></div></div><span class="tag ${r.role==="owner"?"owner":""}">${esc(r.role)}</span><span class="tag ${esc(r.status||"active")}">${esc(r.status||"active")}</span>
  <div class="ra">${r.id==="owner"?'<span style="color:var(--mut);font-size:12px">Owner</span>':`<a class="mini" target="_blank" rel="noopener" href="${share(r)}">Share</a><button class="mini ${r.status==="active"?"d":""}" data-tg="${encodeURIComponent(r.id)}" data-to="${r.status==="active"?"disabled":"active"}">${r.status==="active"?"Disable":"Activate"}</button><button class="mini x" data-rm="${encodeURIComponent(r.id)}" aria-label="Remove ${esc(r.email)}" title="Remove">🗑</button>`}</div></div>`).join("")}
  <div class="roles"><div><b>Sales</b>Customers, follow-ups, deals, leads and WhatsApp.</div><div><b>Admin</b>Everything Sales can do, plus business settings and team.</div></div></div>`}
const share=r=>"https://wa.me/?text="+encodeURIComponent(`You're invited to join ${clean(biz.name)||"our business"} on BusinessOS as ${r.role}.\nSign in with Google using ${r.email}:\n${(()=>{const l=new URL("customers.html",location.href);l.searchParams.set("join",bizId);return l.href})()}`);
function randomToken(){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("")}
async function createJoinLink(){try{const token=randomToken();await setDoc(doc(db,"teamJoinLinks",token),{businessId:bizId,role:"sales",status:"active",createdBy:user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});const u=new URL("customers.html",location.href);u.searchParams.set("joinToken",token);const link=u.href;$("joinLinkMsg").textContent=link;$("copyJoinLink").disabled=false;$("shareJoinLink").href="https://wa.me/?text="+encodeURIComponent("Join "+(clean(biz.name)||"our business")+" on BusinessOS as a Sales Agent. Sign in with Google: "+link);$("shareJoinLink").style.pointerEvents="auto";$("shareJoinLink").style.opacity="1";$("copyJoinLink").onclick=async()=>{try{await navigator.clipboard.writeText(link);toast("Join link copied")}catch(e){toast("Select and copy the link above",true)}};toast("Sales join link created");}catch(e){console.error(e);toast(e.message||"Could not create join link",true)}}

function plan(){const p=String(biz.plan||"trial").toLowerCase(),paid=PAID.includes(p)||String(user.email||"").toLowerCase()==="saif.anwar1618@gmail.com",pct=usage==null?0:Math.min(100,Math.round(usage/FREE_LIMIT*100));
  return`<div class="grid"><div class="card pad"><h2>Plan &amp; usage</h2><div class="sub">What your workspace includes today.</div><div class="kv"><span>Current plan</span><b style="text-transform:capitalize">${esc(p==="trial"?"Free trial":p)}</b></div>
  ${paid?`<div class="kv"><span>Records</span><b>Unlimited</b></div>`:`<div style="padding-top:12px"><div class="kv" style="border:0;padding:0"><span>Records used</span><b>${usage==null?"—":usage} of ${FREE_LIMIT}</b></div><div class="track"><i class="${pct>=100?"f":pct>=80?"w":""}" style="width:${pct}%"></i></div><div style="color:var(--mut);font-size:12px">${usage==null?"Usage unavailable right now.":pct>=100?"Limit reached — upgrade to add more customers.":FREE_LIMIT-usage+" records left on the free plan."} Customers and active enquiries both count.</div></div>`}
  <div class="mf" style="justify-content:flex-start"><a class="btn p" href="subscription.html">${paid?"Manage plan":"Upgrade plan"}</a></div></div>
  <div class="card pad"><h2>Workspace</h2><div class="sub">Details for support and reference.</div><div class="kv"><span>Owner</span><b>${esc(biz.ownerEmail||user.email||"—")}</b></div><div class="kv"><span>Created</span><b>${dt(biz.createdAt)}</b></div><div class="kv"><span>Workspace ID</span><b style="font-size:11.5px">${esc(bizId)}</b></div><div class="mf" style="margin-top:12px;padding-top:12px"><button class="btn" id="cid">Copy workspace ID</button></div></div></div>`}
async function invite(e){e.preventDefault();const email=$("ie").value.trim().toLowerCase(),r=$("ir").value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast("Enter a valid email address",true);if(email===String(user.email||"").toLowerCase())return toast("That's your own email",true);
  try{const ref=doc(db,"businesses",bizId,"teamInvites",email),old=await getDoc(ref);if(old.exists()&&old.data().status==="active")return toast("This email is already active",true);
    await setDoc(ref,{email,role:r,status:"active",businessId:bizId,invitedBy:user.uid,invitedByEmail:user.email||"",createdAt:old.exists()?old.data().createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});toast("Invitation created — tap Share to send it")}catch(x){console.error(x);toast(x.message||"Could not create invitation",true)}}
function listenInvites(){if(unsubI)unsubI();if(unsubJ)unsubJ();if(!manager)return;unsubI=onSnapshot(collection(db,"businesses",bizId,"teamInvites"),s=>{invites=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="team")render()},e=>{console.error(e);$("err").textContent="Could not load team: "+(e.code||e.message);$("err").classList.remove("hidden")});unsubJ=onSnapshot(query(collection(db,"teamJoinLinks"),where("businessId","==",bizId)),s=>{joinLinks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));if(tab==="team")render()},e=>console.warn("join links",e))}
onAuthStateChanged(auth,async u=>{user=u;
  if(!u){$("app").classList.add("hidden");$("auth").classList.remove("hidden");return}
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("avBtn").textContent=ini(u.displayName||u.email);$("ddEm").textContent=u.email||"";
  try{await resolve(u);$("err").classList.add("hidden");render();listenInvites();await loadUsage();if(tab==="plan")render()}catch(e){console.error(e);$("body").innerHTML="";$("chips").innerHTML="";$("sub").textContent="";$("err").textContent=e.message||"Could not open workspace.";$("err").classList.remove("hidden")}});
$("avBtn").onclick=e=>{e.stopPropagation();$("dd").classList.toggle("hidden")};document.addEventListener("click",()=>$("dd").classList.add("hidden"));
$("out").onclick=()=>signOut(auth);$("gbtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("aerr").textContent=e.message}};
document.addEventListener("submit",e=>{if(e.target.id==="invf")invite(e)});
document.addEventListener("click",async e=>{const t=e.target,c=t.closest("[data-tab]");if(c){tab=c.dataset.tab;render();return}
  if(t.id==="cid"){try{await navigator.clipboard.writeText(bizId);toast("Workspace ID copied")}catch(x){toast("Copy failed",true)}return}
  if(t.id==="makeJoinLink"){await createJoinLink();return}
  const cl=t.closest("[data-copy-link]");if(cl){const token=cl.dataset.copyLink;const u=new URL("customers.html",location.href);u.searchParams.set("joinToken",token);try{await navigator.clipboard.writeText(u.href);toast("Join link copied")}catch(x){toast("Copy failed; open this page on HTTPS and try again",true)}return}
  const jl=t.closest("[data-revoke-link]");if(jl){const token=jl.dataset.revokeLink;if(!confirm("Revoke this join link? Existing members will keep access, but nobody new can join with this link."))return;try{await updateDoc(doc(db,"teamJoinLinks",token),{status:"revoked",updatedAt:serverTimestamp()});toast("Join link revoked")}catch(x){toast(x.message||"Could not revoke link",true)}return}
  const g=t.closest("[data-tg]");if(g){const em=decodeURIComponent(g.dataset.tg);try{await updateDoc(doc(db,"businesses",bizId,"teamInvites",em),{status:g.dataset.to,updatedAt:serverTimestamp()});toast(g.dataset.to==="active"?"Member activated":"Member disabled")}catch(x){toast(x.message||"Could not update",true)}return}
  const r=t.closest("[data-rm]");if(r){const em=decodeURIComponent(r.dataset.rm);if(!confirm(`Remove ${em} from your team? They will lose access.`))return;try{await deleteDoc(doc(db,"businesses",bizId,"teamInvites",em));toast("Member removed")}catch(x){toast(x.message||"Could not remove",true)}}});
</script>
