<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry — Business OS</title>
<style>
:root{--ink:#132039;--blue:#315df6;--muted:#748198;--line:#dfe6ef;--soft:#f5f7fb;--green:#0b9460}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 75% 10%,#e9efff,transparent 32%),#f4f6f9}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(680px,96vw);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 80px #14203918;overflow:hidden}.head{padding:30px 32px 20px;background:linear-gradient(135deg,#fff,#f7f9ff);border-bottom:1px solid #edf0f4}.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:900;color:var(--blue)}h1{font-size:28px;margin:8px 0 6px;letter-spacing:-.6px}p{color:var(--muted);font-size:12px;line-height:1.6;margin:0}.form{padding:26px 32px;display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:10px;font-weight:900;color:#66748a}label.full{grid-column:1/-1}input,textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;font-size:13px;outline:none;background:#fff}textarea{height:96px;padding-top:11px;resize:vertical}input:focus,textarea:focus{border-color:#9bb1f7;box-shadow:0 0 0 3px #315df612}.submit{grid-column:1/-1;height:48px;border:0;border-radius:11px;background:var(--ink);color:#fff;font-size:13px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.msg{grid-column:1/-1;min-height:18px;font-size:10px;color:#c43c35}.foot{padding:0 32px 25px;color:#9aa4b2;font-size:9px}@media(max-width:600px){.form{grid-template-columns:1fr;padding:22px}.head{padding:25px 22px}.foot{padding:0 22px 22px}label.full,.submit,.msg{grid-column:auto}}
</style></head><body><main class="wrap"><section class="card"><header class="head"><div class="eyebrow">BUSINESS ENQUIRY</div><h1 id="title">Send your enquiry</h1><p id="subtitle">Fill the form and the business team will contact you.</p></header><form id="leadForm" class="form"><label>Name*<input id="name" required placeholder="Your name"></label><label>Mobile*<input id="phone" required inputmode="tel" placeholder="9876543210"></label><label>Email<input id="email" type="email" placeholder="you@example.com"></label><label>Budget / Fees<input id="budget" placeholder="₹30–35 Lakh"></label><label>Requirement*<input id="requirement" required placeholder="What are you looking for?"></label><label>City<input id="city" placeholder="Jaipur"></label><label>Area / Preferred Location<input id="area" placeholder="Jhotwara"></label><label class="full">Message<textarea id="message" placeholder="Tell us a little more about your requirement..."></textarea></label><div id="msg" class="msg"></div><button id="submit" class="submit">Send Enquiry</button></form><div class="foot">Powered by Business OS · Your enquiry will be shared with the business you contacted.</div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA4GEKs3fxmiqq7iGI4-L-QuqFFwFBZ0dI",authDomain:"business-os-saas-traking.firebaseapp.com",projectId:"business-os-saas-traking",storageBucket:"business-os-saas-traking.firebasestorage.app",messagingSenderId:"316542715521",appId:"1:316542715521:web:32e84948bcc8d52ef9af80",measurementId:"G-85D45ENBLK"};const db=getFirestore(initializeApp(cfg));
const p=new URLSearchParams(location.search),businessId=p.get('business')||'',template=p.get('template')||'general',businessName=p.get('businessName')||'Business';document.title='Enquiry — '+businessName;document.getElementById('title').textContent='Enquire with '+businessName;document.getElementById('subtitle').textContent=template==='property'?'Tell us what property you are looking for.':template==='coaching'?'Tell us about the course or counselling you need.':'Send your requirement and the business team will contact you.';
const form=document.getElementById('leadForm'),msg=document.getElementById('msg'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();if(!businessId){msg.textContent='Invalid enquiry link.';return}btn.disabled=true;msg.textContent='Sending enquiry...';try{const d={businessId,templateId:template,status:'new',name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),budget:document.getElementById('budget').value.trim(),requirement:document.getElementById('requirement').value.trim(),city:document.getElementById('city').value.trim(),area:document.getElementById('area').value.trim(),message:document.getElementById('message').value.trim(),createdAt:serverTimestamp()};await addDoc(collection(db,'publicLeads'),d);form.reset();msg.style.color='#0b9460';msg.textContent='Enquiry sent successfully. The business team will contact you.'}catch(e){console.error(e);msg.style.color='#c43c35';msg.textContent=e.message||'Could not send enquiry.'}finally{btn.disabled=false}});
</script></body></html>
